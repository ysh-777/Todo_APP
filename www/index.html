<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<meta name="theme-color" content="#11201B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#11201B;
    --surface:#1A2C26;
    --surface-2:#223A32;
    --amber:#E8A33D;
    --amber-dim:#B87F2C;
    --text:#F2EFE9;
    --muted:#8FA69C;
    --coral:#D9705A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  #app{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--ink);
    position:relative;
  }

  header{
    padding:28px 22px 14px;
    flex-shrink:0;
  }
  .eyebrow-date{
    color:var(--muted);
    font-size:13px;
    margin:0 0 4px;
  }
  .title-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }
  h1{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:30px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .count-badge{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:34px;
    font-weight:700;
    color:var(--amber);
    line-height:1;
  }
  .count-label{
    font-size:11px;
    color:var(--muted);
    text-align:right;
    margin-top:2px;
  }

  .filters{
    display:flex;
    gap:8px;
    padding:6px 22px 16px;
    flex-shrink:0;
  }
  .filter-chip{
    border:1px solid var(--surface-2);
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    padding:7px 14px;
    border-radius:100px;
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:600;
  }

  #list{
    flex:1;
    overflow-y:auto;
    padding:4px 22px 100px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .task{
    background:var(--surface);
    border-radius:16px;
    padding:14px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .check{
    width:24px;
    height:24px;
    border-radius:50%;
    border:2px solid var(--amber-dim);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .task.done .check{
    background:var(--amber);
    border-color:var(--amber);
  }
  .check svg{width:13px;height:13px;opacity:0;}
  .task.done .check svg{opacity:1;}
  .task-text{
    flex:1;
    font-size:15px;
    line-height:1.35;
    word-break:break-word;
  }
  .task.done .task-text{
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:var(--muted);
  }
  .delete-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:20px;
    line-height:1;
    padding:4px 6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .delete-btn:active{ color:var(--coral); }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:60px;
    padding:0 30px;
    line-height:1.6;
  }

  .composer{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--ink) 60%, transparent);
    display:flex;
    gap:10px;
  }
  #new-task{
    flex:1;
    background:var(--surface-2);
    border:none;
    border-radius:14px;
    padding:14px 16px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
  }
  #new-task::placeholder{ color:var(--muted); }
  #new-task:focus{ outline:2px solid var(--amber-dim); outline-offset:1px; }
  #add-btn{
    width:50px;
    height:50px;
    border-radius:14px;
    border:none;
    background:var(--amber);
    color:var(--ink);
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
  }
  #add-btn:active{ background:var(--amber-dim); }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="eyebrow-date" id="today"></p>
    <div class="title-row">
      <h1>Tasks</h1>
      <div>
        <div class="count-badge" id="count">0</div>
        <div class="count-label">remaining</div>
      </div>
    </div>
  </header>

  <div class="filters">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="active">Active</button>
    <button class="filter-chip" data-filter="done">Done</button>
  </div>

  <div id="list"></div>

  <div class="composer">
    <input id="new-task" type="text" placeholder="Add a task…" maxlength="120">
    <button id="add-btn" aria-label="Add task">+</button>
  </div>
</div>

<script>
  const KEY = "tasks-v1";
  let tasks = null;
  try { tasks = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(tasks)) tasks = [
    { id: 1, text: "Add your own task below", done: false },
    { id: 2, text: "Tap a task to mark it done", done: true }
  ];
  let nextId = tasks.reduce((m, t) => Math.max(m, t.id), 0) + 1;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }
  let filter = "all";

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const input = document.getElementById("new-task");
  const addBtn = document.getElementById("add-btn");

  document.getElementById("today").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });

  function render() {
    const visible = tasks.filter(t =>
      filter === "all" ? true : filter === "active" ? !t.done : t.done
    );

    listEl.innerHTML = "";

    if (visible.length === 0) {
      const msg = filter === "done"
        ? "Nothing completed yet."
        : filter === "active"
          ? "Nothing left — nice work."
          : "No tasks yet. Add your first one below.";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = msg;
      listEl.appendChild(empty);
    } else {
      visible.forEach(t => {
        const row = document.createElement("div");
        row.className = "task" + (t.done ? " done" : "");

        const check = document.createElement("div");
        check.className = "check";
        check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M2 8l4 4 8-8" stroke="#11201B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        check.onclick = () => { t.done = !t.done; render(); };

        const text = document.createElement("div");
        text.className = "task-text";
        text.textContent = t.text;
        text.onclick = () => { t.done = !t.done; render(); };

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "×";
        del.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); render(); };

        row.appendChild(check);
        row.appendChild(text);
        row.appendChild(del);
        listEl.appendChild(row);
      });
    }

    countEl.textContent = tasks.filter(t => !t.done).length;
    save();
  }

  function addTask() {
    const val = input.value.trim();
    if (!val) return;
    tasks.push({ id: nextId++, text: val, done: false });
    input.value = "";
    render();
  }

  addBtn.onclick = addTask;
  input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

  document.querySelectorAll(".filter-chip").forEach(btn => {
    btn.onclick = () => {
      document.querySelector(".filter-chip.active").classList.remove("active");
      btn.classList.add("active");
      filter = btn.dataset.filter;
      render();
    };
  });

  render();
</script>
</body>
</html>
